<div class="margin-global ion-text-center">

  <ion-card class="glass">
    <ion-text color="dark" class="title-card">
      <p>{{ 'ABOUT.TITLE_CARD' | translate }}</p>
    </ion-text>
    <ion-card-content>
      <br><br>
      <ion-row>
        <ion-col *ngFor="let icon of icons">
          <ion-icon class="buttons" size="large" name="{{icon}}"></ion-icon>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <ion-text color="dark">
            <p class="texto text-animated">
              {{ 'ABOUT.DESCRIPTION' | translate }}
            </p>
          </ion-text>
        </ion-col>
      </ion-row>
    </ion-card-content>
  </ion-card>

</div>
