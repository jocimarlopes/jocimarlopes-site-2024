<div class="margin-global ion-text-center">

  <ion-card id="skills-content" class="glass ion-padding-bottom">
    <ion-text color="dark" class="title-card">
      <p>SKILLS</p>
    </ion-text>
    <ion-card-content>
      <br><br>
      <ion-row>
        <ion-col size="{{screen > 800 ? 6 : 12}}">
          <ion-text color="dark">
            <p class="text-animated">
              {{ 'SKILLS.LANGUAGES' | translate }}
            </p>
          </ion-text>
          <ion-item *ngFor="let skill of languages" lines="none" color="transparent">
            <p class="title-skill text-animated">{{skill.title}}</p>
            <div class="progress-bar-content">
              <ion-progress-bar class="progress-bar-left progress-bar-color" color="dark" [value]="skill.value"></ion-progress-bar>
            </div>
          </ion-item>
        </ion-col>
        <ion-col size="{{screen > 800 ? 6 : 12}}">
          <ion-text color="dark">
            <p class="text-animated">
              {{ 'SKILLS.SERVICES' | translate }}
            </p>
          </ion-text>
          <ion-item *ngFor="let skill of softwares" lines="none" color="transparent">
            <p class="title-skill text-animated">{{skill.title}}</p>
            <div class="progress-bar-content">
              <ion-progress-bar class="progress-bar-right progress-bar-color" color="dark" [value]="skill.value"></ion-progress-bar>
            </div>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-card-content>
  </ion-card>

</div>
